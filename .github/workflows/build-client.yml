name: Build client

# Compila TruckDash.exe en un runner limpio de GitHub (build reproducible,
# nadie tiene que confiar en un .exe compilado en la PC de alguien) y, si el
# disparador es un tag v*, publica el Release con el zip y su SHA-256.
#
# Uso: git tag v1.3.0 && git push origin v1.3.0
# (o "Run workflow" a mano desde Actions para solo verificar que compila)
#
# Tambien se puede publicar sin pushear el tag: "Run workflow" con `tag`
# (y opcionalmente `commit`) crea el tag aca adentro y sigue igual que con
# un tag pusheado. Existe porque las sesiones en la nube pueden pushear
# ramas pero no tags. El tag queda en `commit`, que tiene que ser el commit
# de la release: su mensaje es el anuncio de Discord.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Publish a release with this tag (v1.2.3). Empty = only check that it builds.'
        required: false
        default: ''
      commit:
        description: 'Commit to build and tag. Empty = the branch the run starts from.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      # Vacio cuando no hay release: una corrida manual sin tag solo compila.
      RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}
      - name: Create the release tag (manual run)
        # Solo local por ahora: se pushea recien antes de publicar, para no
        # dejar un tag sin release si algo falla en el medio.
        if: github.event_name == 'workflow_dispatch' && inputs.tag != ''
        shell: pwsh
        run: |
          $tag = $env:RELEASE_TAG
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') { throw "the tag must look like v1.2.3, got '$tag'" }
          $version = $tag.Substring(1)
          $line = Select-String -Path client/client.py -Pattern '^CLIENT_VERSION = "(.*)"' | Select-Object -First 1
          if (-not $line -or $line.Matches[0].Groups[1].Value -ne $version) {
            throw "client/client.py says $($line.Line), the tag says $version"
          }
          git tag $tag
          git log -1 --format='%h %s' $tag
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r client/requirements.txt
      - name: Run client tests
        run: |
          pip install pytest
          python -m pytest client/ -q
      - name: Build TruckDash.exe
        working-directory: client
        run: pyinstaller TruckDash.spec
      - name: Package zip and checksums
        shell: pwsh
        working-directory: client
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item dist/TruckDash.exe release/TruckDash.exe
          Copy-Item README.md release/README.md
          Copy-Item README.es.md release/README.es.md
          Compress-Archive -Path release/* -DestinationPath TruckDash-windows.zip -Force
          $zip = (Get-FileHash TruckDash-windows.zip -Algorithm SHA256).Hash.ToLower()
          $exe = (Get-FileHash dist/TruckDash.exe -Algorithm SHA256).Hash.ToLower()
          "$zip  TruckDash-windows.zip`n$exe  TruckDash.exe" | Set-Content -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt
          "ZIP_SHA256=$zip" >> $env:GITHUB_ENV
          "EXE_SHA256=$exe" >> $env:GITHUB_ENV
      - uses: actions/upload-artifact@v4
        with:
          name: TruckDash-windows
          path: |
            client/TruckDash-windows.zip
            client/SHA256SUMS.txt
      - name: Push the release tag (manual run)
        if: github.event_name == 'workflow_dispatch' && inputs.tag != ''
        run: git push origin "refs/tags/${{ env.RELEASE_TAG }}"
      - name: Publish release
        if: env.RELEASE_TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            client/TruckDash-windows.zip
            client/SHA256SUMS.txt
          body: |
            Built automatically by GitHub Actions from this tag (see the "Build client" workflow run for the full log).

            **SHA-256**
            - `TruckDash-windows.zip`: `${{ env.ZIP_SHA256 }}`
            - `TruckDash.exe`: `${{ env.EXE_SHA256 }}`

            Windows SmartScreen may warn about an unrecognized app because the executable is not code-signed: click "More info" → "Run anyway". Some antivirus engines flag the file for the same reason (an unsigned one-file PyInstaller executable that unpacks itself at startup) — it is a false positive; the source and this build log are public, and a code signing certificate for open source projects is in progress. The client is open source, needs no admin rights and only reads the game's telemetry.
      - name: Tell the relay which version is the latest
        # Sin este paso el Release existe y no lo recibe nadie: el cliente
        # instalado pregunta /version al relay, y el relay sigue devolviendo
        # la version anterior hasta que alguien la carga a mano. Paso entre
        # 1.5.16 y 1.5.17: la release salio, el anuncio de Discord dijo que
        # los clientes iban a recibir el aviso, y ninguno lo recibio.
        #
        # Va ANTES del anuncio a proposito. Si esto falla, el paso de Discord
        # no corre: mejor quedarse callado que anunciar una actualizacion que
        # despues no le llega a nadie.
        #
        # Solo corre si existe el secret ADMIN_KEY (repo -> Settings ->
        # Secrets -> Actions), la misma clave de los endpoints /admin del
        # relay.
        if: env.RELEASE_TAG != ''
        shell: pwsh
        env:
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          # El contexto `secrets` no esta disponible en el `if:` de un paso.
          if (-not $env:ADMIN_KEY) { Write-Host "ADMIN_KEY not set, skipping"; exit 0 }
          $relay = "https://truck-companion-production.up.railway.app"
          $version = $env:TAG.TrimStart("v")
          $body = @{ latest_client_version = $version
                     latest_client_sha256 = $env:ZIP_SHA256 } | ConvertTo-Json
          $r = Invoke-RestMethod -Method Post -Uri "$relay/admin/stats/seed" `
                 -Headers @{ "X-Admin-Key" = $env:ADMIN_KEY } `
                 -ContentType "application/json" -Body $body
          # La ruta filtra las claves que no conoce en silencio, asi que se
          # comprueba lo que quedo y no lo que se mando.
          if ($r.latest_client_version -ne $version) {
            throw "el relay quedo en $($r.latest_client_version), se esperaba $version"
          }
          Write-Host "El relay ya ofrece $version"
      - name: Announce on Discord
        # Embed en el canal de releases del Discord. Solo si el secret
        # DISCORD_RELEASES_WEBHOOK existe (repo → Settings → Secrets → Actions).
        if: env.RELEASE_TAG != ''
        shell: pwsh
        env:
          DISCORD_RELEASES_WEBHOOK: ${{ secrets.DISCORD_RELEASES_WEBHOOK }}
          TAG: ${{ env.RELEASE_TAG }}
          REPO: ${{ github.repository }}
        run: |
          # El contexto `secrets` no esta disponible en el `if:` de un paso, por
          # eso la comprobacion va aca adentro.
          if (-not $env:DISCORD_RELEASES_WEBHOOK) { Write-Host "DISCORD_RELEASES_WEBHOOK not set, skipping announcement"; exit 0 }
          $tag = $env:TAG
          # Notas: el cuerpo del ultimo commit del tag (la primera linea es el titulo).
          # Las lineas de atribucion (Co-Authored-By, Claude-Session) son para
          # el repo, no para el anuncio.
          $lines = (git log -1 --format=%B "$tag") -split "`n" | Where-Object { $_ -notmatch '^(Co-Authored-By|Claude-Session):' }
          $title = $lines[0]
          $body = (($lines | Select-Object -Skip 1) -join "`n").Trim()
          if ($body.Length -gt 1500) { $body = $body.Substring(0, 1500) + "..." }
          $payload = @{
            username = "Truck Dash releases"
            embeds = @(@{
              title = "Truck Dash $tag is out"
              url = "https://github.com/$env:REPO/releases/tag/$tag"
              description = "**$title**`n`n$body"
              color = 3907327
              fields = @(
                @{ name = "Download"; value = "[TruckDash-windows.zip](https://github.com/$env:REPO/releases/download/$tag/TruckDash-windows.zip)"; inline = $true },
                @{ name = "SHA-256 (zip)"; value = "``$env:ZIP_SHA256``"; inline = $false }
              )
              footer = @{ text = "Running clients get an update prompt automatically. SmartScreen: More info -> Run anyway (unsigned build)." }
            })
          } | ConvertTo-Json -Depth 6
          Invoke-RestMethod -Method Post -Uri $env:DISCORD_RELEASES_WEBHOOK -ContentType "application/json" -Body $payload

  build-linux:
    # Se compila en la LTS mas vieja que soportamos, a proposito: el binario de
    # PyInstaller queda atado a la glibc de la maquina donde se arma, y la de
    # 22.04 (2.35) anda en Ubuntu 22.04+, Debian 12+, Mint 21+, Zorin 17+,
    # Fedora 35+ y cualquier Arch actual. Compilar en la ultima dejaria afuera
    # a la mitad de esa lista sin que nadie se entere hasta que lo reporten.
    #
    # Sube el artefacto de la corrida, NO lo adjunta al Release, y esto NO es
    # "hasta que alguien confirme". Lo de abajo salio del issue #6 (28-09-2026)
    # y conviene tenerlo escrito antes de que a alguien le parezca un olvido:
    #
    # El binario nativo solo sirve para los builds NATIVOS de Linux de los
    # juegos, y casi nadie los usa: son viejos, van por OpenGL y tienen mal
    # soporte de mods, asi que en Linux se juega el build de Windows bajo
    # Proton. Y ahi un cliente nativo no llega a la telemetria: el plugin
    # publica adentro del prefijo de Wine, no en /dev/shm/SCSTelemetry, que es
    # donde mira telemetry_compat en Linux. Encima el .so del plugin nativo ni
    # lo empaquetamos; solo viaja el .dll.
    #
    # El camino que SI anda en Linux es el cliente de Windows adentro del
    # prefijo del juego, documentado en client/README.md, y ese ya se publica
    # como la descarga normal. El build de aca queda como canario de que el
    # codigo sigue empaquetando y arrancando en Linux.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install system packages
        # tkinter para la ventana de Setup, y las libs de X11 que usan
        # python-xlib (teclas por XTEST y ventana del juego) y el backend
        # Xorg de pystray para el icono de la bandeja.
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk libxtst6 libxss1 xvfb
      - name: Install dependencies
        run: pip install -r client/requirements.txt
      - name: Run client tests
        run: |
          pip install pytest
          python -m pytest client/ -q
      - name: Check the build interpreter has tkinter
        # PyInstaller no falla cuando le falta un modulo: lo anota en el log
        # y arma el binario igual, que despues muere al arrancar con
        # ModuleNotFoundError. Lo que no tenga ESTE Python no va a estar en el
        # binario, asi que se verifica antes y no despues de 3 minutos de build.
        run: python -c "import tkinter; print('tkinter', tkinter.TkVersion)"
      - name: Build TruckDash
        working-directory: client
        run: pyinstaller TruckDash.spec
      - name: Smoke test the binary
        env:
          # El runner no tiene escritorio: sin display, pystray no encuentra
          # backend y falla al importarse. Con xvfb se prueba el camino de
          # verdad, el que tiene bandeja, en vez del degradado.
          PYSTRAY_BACKEND: xorg
        # Que compile no es que corra. --help sale por argparse antes de
        # abrir ninguna ventana, pero para llegar ahi tiene que importar todo
        # el programa: es la prueba mas barata de que el empaquetado quedo
        # completo. Sin esto ya se nos escapo un binario sin tkinter.
        working-directory: client
        run: |
          # 1) Con display, que es como corre en la maquina de un usuario.
          xvfb-run -a ./dist/TruckDash --help > smoke-tray.txt 2>&1 || true
          cat smoke-tray.txt
          grep -q "usage:" smoke-tray.txt
          # 2) Sin display: pystray falla al importarse y el cliente tiene que
          # seguir vivo igual. Es el caso de GNOME sin la extension de
          # AppIndicator, que no tiene bandeja, y ahi se cae este binario entero
          # si el import no esta protegido.
          env -u DISPLAY ./dist/TruckDash --help > smoke-sin-bandeja.txt 2>&1 || true
          cat smoke-sin-bandeja.txt
          grep -q "usage:" smoke-sin-bandeja.txt
      - name: Package tarball and checksums
        working-directory: client
        run: |
          mkdir -p release
          cp dist/TruckDash release/TruckDash
          cp README.md README.es.md release/
          tar -czf TruckDash-linux-x86_64.tar.gz -C release .
          tgz=$(sha256sum TruckDash-linux-x86_64.tar.gz | cut -d" " -f1)
          bin=$(sha256sum dist/TruckDash | cut -d" " -f1)
          echo "$tgz  TruckDash-linux-x86_64.tar.gz" > SHA256SUMS-linux.txt
          echo "$bin  TruckDash" >> SHA256SUMS-linux.txt
          cat SHA256SUMS-linux.txt
          echo "glibc de la maquina que compilo:"
          ldd --version | head -1
      - uses: actions/upload-artifact@v4
        with:
          name: TruckDash-linux
          path: |
            client/TruckDash-linux-x86_64.tar.gz
            client/SHA256SUMS-linux.txt
