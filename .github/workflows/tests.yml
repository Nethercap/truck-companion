name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements-dev.txt
      - run: python -m pytest backend/test_main.py -v

  client:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r client/requirements.txt
      - run: python -m pip install pytest
      - run: python -m pytest client/test_client.py client/test_plugin_installer.py -v

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --test docs/app/test_pure.js
      # Un apostrofo sin escapar en una traduccion rompio todo el script
      # inline de la landing en produccion sin que nada fallara (22-09-2026).
      - run: python tools/check_inline_js.py
      # docs/app/variants.js se genera del manifest: si alguien edita uno sin
      # regenerar el otro, la app publica versiones de mapa que no existen.
      - run: python tools/build_variants_js.py --check
