name: Build Android

# La app de Android (android/, una Trusted Web Activity) como AAB para Google
# Play. Corre sola cuando cambia android/ (sin firmar: solo ver que compila) y
# a mano con "Run workflow" para sacar una version para subir.
#
# Firma con la clave de SUBIDA (Play firma despues con la suya, Play App
# Signing). Secrets del repo, ver android/README.md:
#   ANDROID_KEYSTORE_BASE64   el .jks en base64
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
# Sin ellos el AAB sale sin firmar y Play no lo acepta.

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/build-android.yml"
  workflow_dispatch:
    inputs:
      version_name:
        description: "Nombre de la version que se ve en Play (ej. 1.0.1)"
        required: false
        default: ""

jobs:
  aab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Clave de subida (si estan los secrets)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "TD_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "Se firma con la clave de subida"
          else
            echo "Sin ANDROID_KEYSTORE_BASE64: el AAB sale sin firmar"
          fi

      - name: Armar el AAB
        working-directory: android
        env:
          # Cada corrida sube el numero de version (Play exige que crezca)
          TD_VERSION_CODE: ${{ github.run_number }}
          TD_VERSION_NAME: ${{ inputs.version_name || format('1.0.{0}', github.run_number) }}
          TD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TD_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          TD_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle :app:bundleRelease --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: TruckDash-android-${{ github.run_number }}
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
