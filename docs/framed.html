<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<!-- Lo que ve quien abre Truck Dash adentro de un marco de otro sitio: ahi las
     paginas con mapa o con cuenta no se cargan (el guard del head de /app/,
     /live/, /account/ y /vtc/ trae hasta aca). -->
<meta name="robots" content="noindex, nofollow" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Truck Dash</title>
<link rel="icon" type="image/svg+xml" href="/assets/logo.svg" />
<style>
  html, body { height: 100%; }
  body { margin: 0; display: flex; align-items: center; justify-content: center; background: #0b0d10; color: #f2f3f5;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; line-height: 1.5; text-align: center; }
  main { padding: 1.25rem; max-width: 30rem; }
  img { width: 56px; height: 56px; }
  h1 { font-size: 1.35rem; margin: 0.5rem 0 0.35rem; }
  p { margin: 0 0 1.1rem; color: #9aa4b2; }
  a { display: inline-block; padding: 0.6rem 1.1rem; border-radius: 8px; background: #3b9eff; color: #06121f; font-weight: 700; text-decoration: none; }
  a:focus-visible { outline: 3px solid #f2f3f5; outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <img src="/assets/logo.svg" alt="" />
  <h1>Truck Dash</h1>
  <p>This page only works on trucksim-dash.com, not inside another website. It is free and needs no account.</p>
  <a id="open" href="https://trucksim-dash.com/" target="_blank" rel="noopener">Open Truck Dash</a>
</main>
<script>
// Vuelve a la pagina que se queria ver. Solo las de la lista: el # lo puede
// escribir el sitio de afuera.
(function () {
  var pedida = location.hash.slice(1);
  if (['/app/', '/live/', '/account/', '/vtc/'].indexOf(pedida) !== -1) document.getElementById('open').href = 'https://trucksim-dash.com' + pedida;
})();
</script>
</body>
</html>
