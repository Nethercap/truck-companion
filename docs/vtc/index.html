<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<script>
// Adentro de un marco de otro sitio esta pagina no se carga: pedia los mapas
// con el permiso de trucksim-dash.com (los terminos no dejan mostrarlos desde
// otra pagina) y en la cuenta seria clickjacking. Pages no deja mandar
// X-Frame-Options. Solo en el dominio propio: la copia LAN puede ir en el
// marco que quiera su dueno. El mismo texto en /app/, /live/, /account/ y /vtc/.
(function () {
  if (window.top === window.self || !/^(www\.)?trucksim-dash\.com$/.test(location.hostname)) return;
  try { if (window.top.location.origin === location.origin) return; } catch (e) { /* de otro origen */ }
  window.stop();
  location.replace('/framed.html#' + location.pathname.replace(/index\.html$/, ''));
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Truck Dash – Virtual trucking companies</title>
<meta name="description" content="Virtual trucking companies for ETS2 and ATS on Truck Dash: your deliveries count on their own, with fair rankings and nothing to pay." />
<!-- La pagina de cada empresa es /vtc/?TAG. Sin indexar mientras sea beta (o
     este apagada: entonces la API la da por inexistente). -->
<meta name="robots" content="noindex" />
<link rel="icon" type="image/svg+xml" href="../app/assets/logo.svg" />
<meta name="theme-color" content="#0d0f12" />
<link rel="stylesheet" href="../account/account.css?v=20261127i" />
<link rel="stylesheet" href="vtc.css?v=20261127i" />
<script>
// Dentro de la app de Android (TWA): ver el comentario de /account/.
try { if (document.referrer.indexOf('android-app://com.trucksimdash.app') === 0) sessionStorage.setItem('truckdash_twa', '1'); if (sessionStorage.getItem('truckdash_twa') === '1') document.documentElement.classList.add('twa'); } catch (e) {}
</script>
</head>
